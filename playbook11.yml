---
- name: Create users and create files/dirs in the users home dirs using global scope variables
  hosts: all
  tasks:
    - name: Create users
      user:
        name: "{{a}}"
        password: "{{b}}"
        home: "{{c}}"
    - name: Create files or dirs in users home dir
      file:
        name: "{{d}}"
        state: "{{e}}"
...
