---
- name: Configure apache2/httpd on both ubuntu and redhat servers
  hosts: all
  tasks:
    - block:
        - name: Install apache2 on ubuntu servers using apt
          apt:
            name: apache2
            state: present
            update_cache: yes
      rescue:
        - name: Install httpd on redhat servers using yum
          yum:
            name: httpd
            state: present
            update_cache: yes
    - name: Edit the index.html file
      copy:
        content: "IntelliQ"
        dest: /var/www/html/index.html
    - block:
        - name: Restart apache2 on ubuntu servers
          service:
            name: apache2
            state: restarted
      rescue:
        - name: Restart httpd on redhat servers
          service:
            name: httpd
            state: restarted
    - name: Check apache2/httpd repsonse on all the servers
      uri:
        url: "{{item}}"
        status_code: 200
      loop:
        - http://172.31.19.116
        - http://172.31.25.44
        - http://172.31.17.235
...

